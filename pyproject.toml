[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wass-webapp"
version = "1.0.0"
description = "WASS 3D Ocean Wave Stereophotogrammetry Web Studio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["wass", "stereophotogrammetry", "ocean-waves", "fastapi", "threejs", "pointcloud"]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "python-multipart>=0.0.6",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "wass_webapp"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
